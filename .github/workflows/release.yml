name: Release to Hackage

# Publishes the package to Hackage when a vX.Y.Z tag is pushed. Requires the
# HACKAGE_TOKEN repository secret (a Hackage API token from the account's
# "Manage auth tokens" page). CI runs in GitHub's sandbox.
#
# NOTE: the Hackage account must be a member of the "Package uploaders" group
# before the first upload will succeed (a brand-new account returns 403 "No
# access for this resource"). Uploads use the X-ApiKey header directly (Hackage
# rejects `cabal upload --token` with 401 "Bad auth token").

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up GHC
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.12.1.0'   # 3.12+ required for `cabal upload --token`

      - name: Build and test
        run: |
          cabal build all
          cabal test unirate-test --test-show-details=direct

      - name: Build source tarball
        run: cabal sdist

      - name: Publish package to Hackage
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
        run: |
          set -euo pipefail
          TARBALL=$(ls dist-newstyle/sdist/*.tar.gz)
          echo "Publishing $TARBALL"
          code=$(curl -sS -o /tmp/hackage-resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: X-ApiKey ${HACKAGE_TOKEN}" \
            -F "package=@${TARBALL}" \
            https://hackage.haskell.org/packages/)
          echo "Hackage HTTP $code"
          sed -e 's/<[^>]*>//g' /tmp/hackage-resp.txt | grep -vE '^\s*$' | head -20 || true
          test "$code" -ge 200 -a "$code" -lt 300

      - name: Publish Haddock docs to Hackage (best-effort)
        continue-on-error: true
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
        run: |
          cabal haddock --haddock-for-hackage
          DOCS=$(ls dist-newstyle/*-docs.tar.gz)
          curl -sS -X PUT \
            -H "Authorization: X-ApiKey ${HACKAGE_TOKEN}" \
            -H "Content-Type: application/x-tar" \
            -H "Content-Encoding: gzip" \
            --data-binary "@${DOCS}" \
            "https://hackage.haskell.org/package/unirate-api-0.1.0.0/docs"
