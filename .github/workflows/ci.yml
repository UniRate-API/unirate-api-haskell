name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc: ['9.6.6', '9.8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up GHC ${{ matrix.ghc }}
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.10'

      - name: Freeze dependencies
        run: cabal freeze

      - name: Build
        run: cabal build all

      - name: Mock tests (offline)
        run: cabal test unirate-test --test-show-details=direct
